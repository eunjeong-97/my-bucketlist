<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>나의 버킷리스트</title>
    <style>
      body {
        font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        max-width: 650px;
        margin: 50px auto;
        padding: 0 20px;
        background: linear-gradient(180deg, #fffdf0 0%, #ffe9d6 100%);
        background-attachment: fixed;
        color: #333;
      }
      h1 {
        text-align: center;
        font-size: 2rem;
        color: #ff6b35;
        text-shadow: 2px 2px 0 #ffd9c2;
      }
      body > p {
        text-align: center;
        color: #888;
        margin-bottom: 30px;
      }
      h2 {
        border-left: 5px solid #ff6b35;
        padding-left: 10px;
        margin: 30px 0 0;
        padding-top: 16px;
        background: #fff;
        border-radius: 12px 12px 0 0;
        padding-bottom: 8px;
        padding-right: 10px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0 20px 16px;
        background: #fff;
        border-radius: 0 0 12px 12px;
        box-shadow: 0 4px 12px rgba(255, 107, 53, 0.12);
      }
      li {
        line-height: 2;
        padding-left: 28px;
        position: relative;
        border-bottom: 1px dashed #ffd9c2;
        transition: transform 0.15s, color 0.15s;
      }
      li:last-child {
        border-bottom: none;
      }
      li::before {
        content: "☐";
        position: absolute;
        left: 0;
        color: #ff6b35;
      }
      li:hover {
        transform: translateX(6px);
        color: #ff6b35;
      }
    </style>
  </head>
  <body>
    <h1>🪣 나의 소중한 버킷리스트</h1>
    <p>죽기 전에 꼭 해보고 싶은 것들</p>

    <h2>✈️ 여행</h2>
    <ul>
      <li>아이슬란드에서 오로라 보기</li>
      <li>러시아 횡단기차 여행하기</li>
    </ul>

    <h2>💪 도전</h2>
    <ul>
      <li>마라톤 완주하기</li>
      <li>번지점프 뛰기</li>
    </ul>

    <h2>💻 개발자 목표</h2>
    <ul>
      <li>내 이름으로 서비스 런칭하기</li>
      <li>1인 개발역량 기르기</li>
    </ul>
  </body>
</html>
